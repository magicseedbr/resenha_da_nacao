<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Resenha da Nação">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g)"/>
  <g transform="skewX(-12)">
    <rect x="-100" y="0" width="120" height="675" fill="#c0102c" opacity="0.9"/>
    <rect x="60"  y="0" width="120" height="675" fill="#c0102c" opacity="0.5"/>
  </g>
  <g transform="skewX(-12)">
