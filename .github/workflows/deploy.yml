name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um único deploy por vez, sem cancelar uma publicação em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do build
        run: pip install jinja2

      - name: Gerar o site estático
        working-directory: site_builder
        run: python build_site.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir o artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_builder/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
